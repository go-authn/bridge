# The OpenID Foundation conformance suite, the bridge and a test SAML IdP on
# one network. run.sh writes ./work (binaries, keys, configuration) first.
services:
  mongodb:
    image: mongo:6.0.28
  server:
    image: registry.gitlab.com/openid/conformance-suite:${SUITE_TAG:-release-v5.3.1}
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
      OIDC_GOOGLE_CLIENTID: unused
      OIDC_GOOGLE_SECRET: unused
      OIDC_GITLAB_CLIENTID: unused
      OIDC_GITLAB_SECRET: unused
    depends_on: [mongodb]
  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx:${SUITE_TAG:-release-v5.3.1}
    ports: ["8443:8443"]
    networks:
      default:
        # the suite's browser follows redirects to its own public name
        aliases: [localhost.emobix.co.uk]
    depends_on: [server]
  idp:
    image: alpine:3.24
    volumes: ["./work:/work:ro"]
    command: ["/work/testidp", "-listen", ":8443", "-base", "https://idp:8443",
      "-tls-cert", "/work/idp-tls.crt", "-tls-key", "/work/idp-tls.key",
      "-idp-key", "/work/idp.key", "-idp-cert", "/work/idp.crt",
      "-fed-key", "/work/fed.key", "-fed-cert", "/work/fed.crt",
      "-sp-metadata", "https://bridge:8443/saml/metadata"]
  bridge:
    image: alpine:3.24
    volumes: ["./work:/work:ro", "bridgedata:/data"]
    command: ["/work/bridge", "-c", "/work/bridge.hcl"]
    # the SSF queue, its state and the admin socket: written, so not in
    # ./work; a named volume, so that grpcurl can reach the socket
    # the run's CA, for the IdP's metadata over https (Go reads it on Linux)
    environment:
      SSL_CERT_FILE: /work/ca.crt
    ports: ["9443:8443"]
    # it reads the IdP's metadata at start, so it waits for the IdP
    restart: on-failure
    depends_on: [idp]
  # The operator's side of an SSF event: the bridge's admin API, by grpcurl
  # on its unix socket. Run by the driver when a module asks; not started.
  admin:
    image: fullstorydev/grpcurl:v1.9.3
    # the socket is the bridge's, mode 0600 (root in its container): the
    # operator runs as its owner, as on a host
    user: "0:0"
    volumes: ["bridgedata:/data"]
    profiles: ["tools"]

volumes:
  bridgedata:
