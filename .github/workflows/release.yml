name: Release

# A tag publishes bridge for every {linux,darwin,windows} x {amd64,arm64},
# pure Go (CGO_ENABLED=0), with a SHA256SUMS manifest and a build provenance
# attestation per binary, so that anyone can check a download came from THIS
# repository's workflow at THIS tag:
#
#   sha256sum -c SHA256SUMS --ignore-missing
#   gh attestation verify bridge-linux-amd64 --repo go-authn/bridge
#
# Same shape as go-pkgx/pkgm's release workflow, plus the attestation and a
# guard that the binary reports the tag it is published under.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Must already exist."
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # the release and its assets
      id-token: write       # the provenance attestation's signing identity
      attestations: write   # recording it
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then tag="$INPUT_TAG"; else tag="$REF_NAME"; fi
          printf '%s\n' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "::error::$tag is not vMAJOR.MINOR.PATCH"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The whole history and the tags: Go stamps the module version from the
      # tag the checkout sits on (debug.ReadBuildInfo), which is what
      # bridge --version prints.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            out="bridge-${os}-${arch}"; [ "$os" = windows ] && out="${out}.exe"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "dist/${out}" .
          done
          cd dist && sha256sum bridge-* > SHA256SUMS && cat SHA256SUMS

      # ⛔ A binary that does not know its own version is one nobody can match
      # to a security advisory. The release stops here rather than publish it.
      - name: The binary reports the tag it is published under
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          got=$(./dist/bridge-linux-amd64 --version 2>&1 || true)
          echo "$got"
          case "$got" in *"$TAG"*) ;; *) echo "::error::bridge reports '$got', not $TAG"; exit 1;; esac

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/bridge-*

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          bridge: ${{ github.repository }}
        run: |
          set -eu
          notes=$(printf '%s\n' \
            "Static bridge binaries (CGO_ENABLED=0) for linux, darwin and windows on amd64 and arm64." \
            "" \
            "Verify a download:" \
            "" \
            "    sha256sum -c SHA256SUMS --ignore-missing" \
            "    gh attestation verify bridge-linux-amd64 --repo $bridge")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes "$notes" --verify-tag
          fi
