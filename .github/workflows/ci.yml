name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      # The federation and the IdP are xmlsec1, which nobody here wrote; the
      # relying party is x/oauth2 and go-oidc. A login this repository both
      # produced and accepted would prove only that its halves agree.
      - name: xmlsec1
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xmlsec1
      # OpenSSH's sshd judges the EuroHPC-profile certificates
      # (TestSSHProfileAgainstSSHD), required on this lane by
      # BRIDGE_REQUIRE_JUDGE. /run/sshd is its privilege-separation directory.
      - name: sshd
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y -qq openssh-server openssh-client
          sudo mkdir -p /run/sshd
          /usr/sbin/sshd -V 2>&1 || true
      # go-fileshare, the real release: what this provider issues it must
      # accept, and refuse once the person is disabled (interop_test.go).
      - name: fileshare
        if: matrix.os == 'ubuntu-latest'
        run: go install github.com/go-fileshare/fileshare@v0.22.1
      # openid-client, an OpenID Certified relying party, as this provider's
      # client (openidclient_test.go); pinned by internal/app/testdata/openid-client's lock.
      - uses: actions/setup-node@v7
        if: matrix.os == 'ubuntu-latest'
        with: { node-version: lts/* }
      - name: openid-client
        if: matrix.os == 'ubuntu-latest'
        run: npm ci --prefix internal/app/testdata/openid-client --no-audit --no-fund
      # The ACME CA is Pebble, Let's Encrypt's test CA, with External Account
      # Binding required as HARICA requires it. Pure Go, so every OS has it.
      - name: pebble
        run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
      - name: the judge is there
        if: matrix.os == 'ubuntu-latest'
        run: xmlsec1 --version
      - run: go vet ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      # The admin API follows buf's STANDARD rules, as fileshare.admin.v1 does,
      # so that the two daemons' APIs read alike.
      - name: buf lint
        if: matrix.os == 'ubuntu-latest'
        run: cd proto && go run github.com/bufbuild/buf/cmd/buf@v1.73.0 lint
      # ⛔ The command is authn-bridge, not bridge: iproute2 owns that name
      # on Linux. What `go install .../cmd/authn-bridge` produces must call
      # itself so, and its version line is what the release guard reads.
      - name: the command is authn-bridge
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/authn-bridge" ./cmd/authn-bridge
          got=$("$RUNNER_TEMP/authn-bridge" --version)
          echo "$got"
          case "$got" in "authn-bridge version "*) ;; *) echo "::error::the binary says '$got'"; exit 1 ;; esac
      - run: go test -count=1 ./...
        env:
          # Ubuntu installs xmlsec1 above, so a skipped test there is a lane
          # passing for the wrong reason.
          BRIDGE_REQUIRE_JUDGE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  # The state database on PostgreSQL, not only SQLite: placeholders, types
  # and transactions are the driver's, and SQLite forgives what PostgreSQL
  # does not.
  postgres:
    name: state on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      - name: xmlsec1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xmlsec1
      # shell: bash is -eo pipefail; the default is -e alone, and tee would
      # hide a failing test.
      - shell: bash
        run: go test -count=1 -run 'TestState' -v ./... | tee state.log
        env:
          BRIDGE_REQUIRE_JUDGE: "1"
          BRIDGE_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # A lane that passed on SQLite because the variable did not arrive
      # would say nothing about PostgreSQL.
      - name: it ran on PostgreSQL
        run: |
          grep -q "made read-only through its file: SQLite only" state.log

  race:
    name: race detector
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      # ⛔ The judge belongs in every lane that RUNS the tests, not only the
      # one named "test": without it almost every test here skips, and a skip
      # is not a failure. BRIDGE_REQUIRE_JUDGE turns that skip into a failure
      # wherever the judge is supposed to be there.
      - name: xmlsec1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xmlsec1
      - name: sshd
        run: |
          sudo apt-get install -y -qq openssh-server openssh-client
          sudo mkdir -p /run/sshd
      - name: fileshare
        run: go install github.com/go-fileshare/fileshare@v0.22.1
      - uses: actions/setup-node@v7
        with: { node-version: lts/* }
      - name: openid-client
        run: npm ci --prefix internal/app/testdata/openid-client --no-audit --no-fund
      - name: pebble
        run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
      - run: go test -race -count=1 ./...
        env:
          BRIDGE_REQUIRE_JUDGE: "1"

  coverage:
    name: coverage (the standard is 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      # ⛔ The judge belongs in every lane that RUNS the tests, not only the
      # one named "test": without it almost every test here skips, and a skip
      # is not a failure. BRIDGE_REQUIRE_JUDGE turns that skip into a failure
      # wherever the judge is supposed to be there.
      - name: xmlsec1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xmlsec1
      - name: sshd
        run: |
          sudo apt-get install -y -qq openssh-server openssh-client
          sudo mkdir -p /run/sshd
      - name: fileshare
        run: go install github.com/go-fileshare/fileshare@v0.22.1
      - uses: actions/setup-node@v7
        with: { node-version: lts/* }
      - name: openid-client
        run: npm ci --prefix internal/app/testdata/openid-client --no-audit --no-fund
      - name: pebble
        run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
      - run: |
          export BRIDGE_REQUIRE_JUDGE=1
          FLOOR=88.0
          # proto/ is protoc's output: measuring it measures the generator, and
          # it would pull the total under the floor by code nobody here wrote.
          # cmd/ is one line calling internal/app's Main, which is what the
          # root package's main() was before v0.20.0: the code measured is the
          # same, and so is the floor.
          pkgs=$(go list ./... | grep -v -e /proto/ -e /cmd/ | paste -sd, -)
          echo "measuring: $pkgs"
          go test -coverprofile=cover.out -coverpkg="$pkgs" ./... >/dev/null
          go tool cover -func=cover.out
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%  floor: ${FLOOR}%  standard: 100%"
          # Written as an `if` rather than `awk ... && { ... }`: in that form
          # the LIST's status is awk's, and when it is the last line of the
          # script the step inherits it -- so a lane that is comfortably above
          # its floor fails, saying nothing about why. It cost a run here.
          if awk -v c="$cov" -v f="$FLOOR" 'BEGIN{exit !(c+0 < f+0)}'; then
            echo "::error::coverage ${cov}% fell below the recorded floor ${FLOOR}%"
            exit 1
          fi
          awk -v c="$cov" 'BEGIN{if (c+0 < 100) printf "::warning::%.1f points short of the 100%% standard\n", 100-c}'

  # The toolchain is the one go.mod names (go-version-file), so a floor too
  # low to carry the standard library's fixes is a finding HERE: govulncheck
  # exits 3 on any, and the job fails.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  arches:
    name: arch ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64, loong64, ppc64le, s390x, 386, arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      - run: GOARCH=${{ matrix.goarch }} go build ./...
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: Test
        run: |
          # ⛔ Resolve the emulator, accept EITHER binary name, and FAIL when neither
          # is there -- a lane that reports success for an architecture it never ran is
          # the one outcome this matrix exists to rule out. qemu-user ships the dynamic
          # qemu-<arch>; qemu-user-static, now a virtual package, shipped the static one.
          qemu_for() {
            for cand in "qemu-$1-static" "qemu-$1"; do
              command -v "$cand" >/dev/null 2>&1 && { printf '%s\n' "$cand"; return 0; }
            done
            echo "::error::no qemu user emulator for $1 (looked for qemu-$1-static and qemu-$1)" >&2
            return 1
          }
          case "${{ matrix.goarch }}" in
            amd64|arm64) go test -count=1 ./... ;;
            riscv64) e="$(qemu_for riscv64)" || exit 1; echo "running riscv64 under $e"; GOARCH=riscv64 go test -count=1 -exec="$e" ./... ;;
            loong64) e="$(qemu_for loongarch64)" || exit 1; echo "running loong64 under $e"; GOARCH=loong64 go test -count=1 -exec="$e" ./... ;;
            ppc64le) e="$(qemu_for ppc64le)" || exit 1; echo "running ppc64le under $e"; GOARCH=ppc64le go test -count=1 -exec="$e" ./... ;;
            s390x) e="$(qemu_for s390x)" || exit 1; echo "running s390x under $e"; GOARCH=s390x   go test -count=1 -exec="$e" ./... ;;
            # 32-bit: 386 runs natively on the amd64 runner (qemu-i386 loses float
            # state across preemption); arm under qemu.
            386)      GOARCH=386     go test -count=1 ./... ;;
            arm) e="$(qemu_for arm)" || exit 1; echo "running arm under $e"; GOARCH=arm     go test -count=1 -exec="$e" ./... ;;
          esac
