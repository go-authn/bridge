syntax = "proto3";

// The administration API of go-authn/bridge: what an operator asks a running
// provider, and the few things it may tell it to do. It is served only when
// the configuration has an admin block, on a unix socket or over mutual TLS.
package bridge.admin.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-authn/bridge/proto/bridge/admin/v1;adminv1";

service AdminService {
  // Status is what the provider is, and how it is doing.
  rpc Status(StatusRequest) returns (StatusResponse);
  // RefreshMetadata fetches the federation's metadata now, rather than at
  // the next scheduled refresh, and says how it went.
  rpc RefreshMetadata(RefreshMetadataRequest) returns (RefreshMetadataResponse);
  // ListIdPs lists the federation's identity providers, as the institution
  // list shows them.
  rpc ListIdPs(ListIdPsRequest) returns (ListIdPsResponse);
  // ListClients lists the relying parties the configuration declares.
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse);
  // RevokePerson ends everything this provider still holds for somebody:
  // their refresh token families, the access tokens those bought, their
  // logins and device grants in progress, and their application password.
  rpc RevokePerson(RevokePersonRequest) returns (RevokePersonResponse);
  // DisablePerson stops somebody logging in and getting tokens here, and
  // revokes what they still hold (as RevokePerson). Their institution still
  // vouches for them: this is this provider refusing, until EnablePerson or
  // the end the request gave. It is kept in the configuration's
  // disabled_file, and refused when there is none: a person disabled until
  // the next restart is worse than one never disabled.
  rpc DisablePerson(DisablePersonRequest) returns (DisablePersonResponse);
  rpc EnablePerson(EnablePersonRequest) returns (EnablePersonResponse);
  // DisableIdP stops everybody logging in through one institution, and
  // revokes what its people still hold. Metadata refreshes do not lift it.
  rpc DisableIdP(DisableIdPRequest) returns (DisableIdPResponse);
  rpc EnableIdP(EnableIdPRequest) returns (EnableIdPResponse);
  // ListDisabled lists the people and institutions disabled here.
  rpc ListDisabled(ListDisabledRequest) returns (ListDisabledResponse);
}

message StatusRequest {}

message RefreshMetadataResponse {
  // status is the provider after the attempt: its federation says when the
  // metadata was last fetched, and last_error why this attempt failed.
  StatusResponse status = 1;
}

message StatusResponse {
  string version = 1;
  string issuer = 2;
  google.protobuf.Timestamp started = 3;
  Federation federation = 4;
  Counts counts = 5;
}

message Federation {
  string metadata_url = 1;
  // idps is how many SAML 2.0 IdPs the metadata lists; usable those the
  // configuration lets people log in through.
  int32 idps = 2;
  int32 usable = 3;
  google.protobuf.Timestamp valid_until = 4;
  google.protobuf.Timestamp last_refresh = 5;
  // last_error is the last refresh that failed, empty when the last one
  // succeeded.
  string last_error = 6;
}

// Counts are what the provider holds in memory right now.
message Counts {
  int64 logins_in_progress = 1;
  int64 codes = 2;
  int64 devices_waiting = 3;
  int64 refresh_families = 4;
  int64 access_tokens = 5;
}

message RefreshMetadataRequest {}

message ListIdPsRequest {
  // query matches display names, domains and entity IDs, as the
  // institution list's search does. Empty lists them all.
  string query = 1;
  // limit bounds the answer; 0 is 100.
  int32 limit = 2;
}

message IdP {
  string entity_id = 1;
  string name = 2;
  repeated string scopes = 3;
  repeated string categories = 4;
  // allowed is whether people can log in through it: the configuration
  // lists it (or lists none) and it is not disabled.
  bool allowed = 5;
  bool disabled = 6;
}

message ListIdPsResponse {
  repeated IdP idps = 1;
  // total is how many matched, of which idps is the first limit.
  int32 total = 2;
}

message ListClientsRequest {}

message Client {
  string id = 1;
  string name = 2;
  bool public = 3;
  string subject = 4;
  repeated string audience = 5;
  bool device = 6;
  bool ssh_certificates = 7;
  bool app_passwords = 8;
  // refresh_lifetime_seconds is 0 when the client has no refresh tokens.
  int64 refresh_lifetime_seconds = 9;
}

message ListClientsResponse {
  repeated Client clients = 1;
}

message RevokePersonRequest {
  // username is the person's preferred_username (eppn by default), as the
  // tokens and certificates this provider issued name them.
  string username = 1;
}

// Revoked is what a revocation ended.
message Revoked {
  int32 refresh_families = 1;
  int32 access_tokens = 2;
  // logins are logins and device grants in progress.
  int32 logins = 3;
  int32 app_passwords = 4;
  // certificates are the SSH and X.509 certificates revoked: listed in
  // /ssh/krl and /x509/crl until they expire.
  int32 certificates = 5;
}

message RevokePersonResponse {
  Revoked revoked = 1;
}

// Disabled is one person or one institution this provider refuses.
message Disabled {
  // Exactly one of username and entity_id is set.
  string username = 1;
  string entity_id = 2;
  string reason = 3;
  // by is who disabled it: cn=<certificate CN> or uid=<peer uid>.
  string by = 4;
  google.protobuf.Timestamp since = 5;
  // until is when it lapses; absent, never.
  google.protobuf.Timestamp until = 6;
}

message DisablePersonRequest {
  // username is the person's preferred_username, as RevokePersonRequest.
  string username = 1;
  string reason = 2;
  // until is when it lapses; absent, it lasts until EnablePerson.
  google.protobuf.Timestamp until = 3;
}

message DisablePersonResponse {
  Disabled disabled = 1;
  Revoked revoked = 2;
}

message EnablePersonRequest {
  string username = 1;
}

message EnablePersonResponse {
  // was_disabled is false when there was nothing to lift.
  bool was_disabled = 1;
}

message DisableIdPRequest {
  string entity_id = 1;
  string reason = 2;
  google.protobuf.Timestamp until = 3;
}

message DisableIdPResponse {
  Disabled disabled = 1;
  Revoked revoked = 2;
}

message EnableIdPRequest {
  string entity_id = 1;
}

message EnableIdPResponse {
  bool was_disabled = 1;
}

message ListDisabledRequest {}

message ListDisabledResponse {
  repeated Disabled people = 1;
  repeated Disabled idps = 2;
}
